packages:
  - "."

# This exact Workers type release is already pinned in the existing lockfile.
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd
